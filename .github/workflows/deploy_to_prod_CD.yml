# Deploy Databricks Asset Bundle to production
name: "Production deployment"

concurrency:
  group: prod-deployment
  cancel-in-progress: false

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: "Deploy bundle"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: databricks/setup-cli@main

      - name: Deploy Databricks bundle to PROD
        run: databricks bundle deploy
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_BUNDLE_ENV: prod

  pipeline_update:
    name: "Run Job"
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - uses: actions/checkout@v3

      - uses: databricks/setup-cli@main

      - name: Run Databricks Job (PROD)
        run: databricks bundle run dabs_cicd_example_job --refresh-all
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_BUNDLE_ENV: prod
