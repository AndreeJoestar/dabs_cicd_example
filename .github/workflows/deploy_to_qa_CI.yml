# This workflow validates, deploys, and runs the specified bundle
# within a pre-production target named "qa".
name: "QA deployment"

# Ensure that only one QA workflow runs at a time
concurrency:
  group: qa-deployment
  cancel-in-progress: true

# Trigger on pull request to main
on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  deploy:
    name: "Deploy bundle"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: databricks/setup-cli@main

      - name: Deploy Databricks bundle to QA
        run: databricks bundle deploy
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_BUNDLE_ENV: qa

  pipeline_update:
    name: "Run Job"
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - uses: actions/checkout@v3

      - uses: databricks/setup-cli@main

      - name: Run Databricks Job
        run: databricks bundle run dabs_cicd_example_job --refresh-all
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_BUNDLE_ENV: qa
